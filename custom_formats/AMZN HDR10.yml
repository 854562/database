name: AMZN HDR10
description: Matches 2160p WEB-DL releases from Amazon Prime with Dolby Vision or HDR Formats, but Dolby Vision Profile 5 is negated.
tags:
- Streaming Service
- WEB-DL
- Colour Grade
- HDR
conditions:
- name: 2160p
  negate: false
  required: true
  resolution: 2160p
  type: resolution
- name: WEB-DL
  negate: false
  required: true
  source: web_dl
  type: source
- name: DV HDR
  negate: false
  pattern: Basic HDR Formats
  required: true
  type: release_title
- name: Not DV P5
  negate: true
  pattern: Dolby Vision (Without Fallback)
  required: true
  type: release_title
- name: AMZN Regex
  negate: false
  pattern: Amazon Prime
  required: true
  type: release_title
tests: []
